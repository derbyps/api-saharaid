service: saharaid-backoffice
frameworkVersion: "3.22.0"
# Serverless 3.22 predates Python 3.12; keep other validation warnings visible.
configValidationMode: warn

provider:
  name: aws
  runtime: python3.12
  architecture: x86_64
  region: ${env:AWS_REGION}
  layers:
    - arn:aws:lambda:ap-southeast-1:698609526643:layer:essential-layer:1
    - arn:aws:lambda:ap-southeast-1:770693421928:layer:Klayers-p312-pandas:17
    - arn:aws:lambda:ap-southeast-1:770693421928:layer:Klayers-p38-openpyxl:4
  environment:
    RDS_HOST: ${env:RDS_HOST}
    RDS_USER: ${env:RDS_USER}
    RDS_PASSWORD: ${env:RDS_PASSWORD}
    RDS_DATABASE: ${env:RDS_DATABASE}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${env:S3_BUCKET}/*
  httpApi:
    cors: true
    authorizers:
      cognito:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${env:COGNITO_USER_POOL_ID}
        audience:
          - ${env:COGNITO_APP_CLIENT_ID}

functions:
  login:
    handler: functions/login/lambda_function.lambda_handler
    package:
      patterns:
        - "functions/login/**"
        - "!**/__pycache__/**"
        - "!**/*.pyc"
    environment:
      COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID}
    events:
      - httpApi:
          path: /login
          method: post

  courseOption:
    handler: functions/courseOption/lambda_function.lambda_handler
    environment:
      S3_BUCKET: ${env:S3_BUCKET}
    package:
      patterns:
        - "functions/courseOption/**"
        - "functions/documents/schemas/document.py"
        - "!**/__pycache__/**"
        - "!**/*.pyc"
    events:
      - httpApi:
          path: /course/options
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /course/options
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /course/options/{id}
          method: patch
          authorizer:
            name: cognito

  documents:
    handler: functions/documents/lambda_function.lambda_handler
    package:
      patterns:
        - "functions/documents/**"
        - "functions/participant/repositories/participant.py"
        - "functions/participant/schemas/participant.py"
        - "!**/__pycache__/**"
        - "!**/*.pyc"
    environment:
      S3_BUCKET: ${env:S3_BUCKET}
    events:
      - httpApi:
          path: /files/presign-upload
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /files/presign-download
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /documents
          method: post
          authorizer:
            name: cognito

  instructor:
    handler: functions/instructor/lambda_function.lambda_handler
    environment:
      S3_BUCKET: ${env:S3_BUCKET}
    package:
      patterns:
        - "functions/instructor/**"
        - "functions/documents/schemas/document.py"
        - "!**/__pycache__/**"
        - "!**/*.pyc"
    events:
      - httpApi:
          path: /instructor
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /instructor/{id}
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /instructor
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /instructor/{id}
          method: put
          authorizer:
            name: cognito

  participant:
    handler: functions/participant/lambda_function.lambda_handler
    environment:
      S3_BUCKET: ${env:S3_BUCKET}
    package:
      patterns:
        - "functions/participant/**"
        - "functions/documents/schemas/document.py"
        - "!**/__pycache__/**"
        - "!**/*.pyc"
    events:
      - httpApi:
          path: /participant
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /participant/{id}
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /participant
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /participant/bulk
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /participant/{id}
          method: put
          authorizer:
            name: cognito
      - httpApi:
          path: /participant/{id}
          method: delete
          authorizer:
            name: cognito

package:
  individually: true
  patterns:
    - "!**"
    - "shared/**"
