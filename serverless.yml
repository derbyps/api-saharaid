service: saharaid-backoffice
frameworkVersion: '3.22.0'
# Serverless 3.22 predates Python 3.12; keep other validation warnings visible.
configValidationMode: warn

plugins:
  - serverless-python-requirements

provider:
  name: aws
  runtime: python3.12
  architecture: x86_64
  region: ${env:AWS_REGION}
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${env:S3_BUCKET}/documents/participant/*
  httpApi:
    authorizers:
      cognito:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${env:COGNITO_USER_POOL_ID}
        audience:
          - ${env:COGNITO_APP_CLIENT_ID}

functions:
  participant:
    handler: functions/participant/lambda_function.lambda_handler
    # ponytail: direct RDS connections; raise this only with database connection capacity.
    reservedConcurrency: ${env:PARTICIPANT_RESERVED_CONCURRENCY, 5}
    events:
      - httpApi:
          path: /participant
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /participant/{id}
          method: get
          authorizer:
            name: cognito
      - httpApi:
          path: /participant
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /participant
          method: put
          authorizer:
            name: cognito

  documents:
    handler: functions/documents/lambda_function.lambda_handler
    environment:
      S3_BUCKET: ${env:S3_BUCKET}
    # ponytail: direct PostgreSQL connections; raise this only with database connection capacity.
    reservedConcurrency: ${env:DOCUMENTS_RESERVED_CONCURRENCY, 5}
    events:
      - httpApi:
          path: /files/presign-upload
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /files/presign-download
          method: post
          authorizer:
            name: cognito
      - httpApi:
          path: /documents
          method: post
          authorizer:
            name: cognito

custom:
  pythonRequirements:
    dockerizePip: non-linux
    dockerRunCmdExtraArgs:
      - --platform
      - linux/amd64

package:
  patterns:
    - '!.venv/**'
    - '!_docs/**'
    - '!migrations/**'
    - '!tests/**'
